services:
  postgres:
    image: postgres:16-alpine
    container_name: forgeai-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: forgeai
      POSTGRES_PASSWORD: forgeai
      POSTGRES_DB: forgeai
    ports:
      - "5434:5432"
    volumes:
      - forgeai-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U forgeai -d forgeai"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  forgeai-pgdata:
